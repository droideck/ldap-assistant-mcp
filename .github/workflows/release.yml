name: Release

# Tag-triggered release: build → publish to PyPI (trusted publishing) →
# publish to the official MCP Registry (GitHub OIDC).
#
# One-time setup required before the first release:
#   1. PyPI: add a "trusted publisher" for this repo/workflow
#      (project ldap-assistant-mcp → Publishing → GitHub → this repo,
#      workflow release.yml, environment pypi).
#   2. GitHub: create an environment named "pypi" (Settings → Environments).
# The MCP Registry step runs only once server.json exists (Phase 2).

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mcp-publisher GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check for server.json
        id: server_json
        run: |
          if [ -f server.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "server.json not found — skipping MCP Registry publish (lands with Phase 2)."
          fi

      - name: Install mcp-publisher
        if: steps.server_json.outputs.present == 'true'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        if: steps.server_json.outputs.present == 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
