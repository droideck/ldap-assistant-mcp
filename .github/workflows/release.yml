name: Release

# Tag-triggered release: run the FULL test suite on the tag SHA + verify all
# version declarations agree → build → publish to PyPI (trusted publishing) →
# publish to the official MCP Registry (GitHub OIDC) + create a GitHub
# Release carrying the same wheel/sdist that went to PyPI.
#
# Nothing is built or published unless every pytest.yml job passes on the
# exact tagged commit and the tag / pyproject.toml / uv.lock / server.json /
# CHANGELOG.md versions all agree (scripts/check-version-consistency.py).
#
# One-time setup required before the first release:
#   1. PyPI: add a "trusted publisher" for this repo/workflow
#      (project ldap-assistant-mcp → Publishing → GitHub → this repo,
#      workflow release.yml, environment pypi).
#   2. GitHub: create an environment named "pypi" (Settings → Environments).
# The MCP Registry step runs only when server.json is present at the tagged commit.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release pipeline per tag; never cancel a publish that is already
# in flight (a half-published release is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate 1: the full test suite (lint/unit/build smoke + all container jobs)
  # must pass on the exact tagged commit before anything is built or
  # published. Reuses pytest.yml via workflow_call; the called workflow
  # checks out the caller's ref (the tag SHA).
  test:
    name: Test suite (tag gate)
    uses: ./.github/workflows/pytest.yml
    secrets: inherit

  # Gate 2: the tag, pyproject.toml, uv.lock, both server.json version
  # fields, and the top CHANGELOG.md release heading must all agree.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check version declarations agree with the tag
        run: python scripts/check-version-consistency.py --tag "$GITHUB_REF_NAME"

  build:
    name: Build distribution
    needs: [test, version-consistency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mcp-publisher GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Check for server.json
        id: server_json
        run: |
          if [ -f server.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "server.json not found — skipping MCP Registry publish (add server.json to enable it)."
          fi

      - name: Install mcp-publisher
        if: steps.server_json.outputs.present == 'true'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        if: steps.server_json.outputs.present == 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LDAP Assistant MCP $GITHUB_REF_NAME" \
            --generate-notes
